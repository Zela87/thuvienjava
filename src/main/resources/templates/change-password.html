<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu | Quản lý thư viện</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body>
<header th:replace="~{fragments/navigation :: topbar}"></header>
<main class="auth-card"><h1>Đổi mật khẩu</h1>
    <div class="success" th:if="${success}" th:text="${success}"></div><div class="alert" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/doi-mat-khau}">
        <label for="oldPassword">Mật khẩu hiện tại</label><input id="oldPassword" name="oldPassword" type="password" autocomplete="current-password" required>
        <label for="newPassword">Mật khẩu mới (ít nhất 6 ký tự)</label><input id="newPassword" name="newPassword" type="password" minlength="6" autocomplete="new-password" required>
        <label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
        <button type="submit">Lưu thay đổi</button>
    </form>
</main></body></html>
