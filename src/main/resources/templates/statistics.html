<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thống kê | Quản lý thư viện</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body>
<header th:replace="~{fragments/navigation :: topbar}"></header>
<main class="admin-page" id="report"><div class="report-title"><div><h1>Thống kê thư viện</h1><p class="muted">Tổng quan và danh sách sách đang quá hạn</p></div><button onclick="window.print()">In báo cáo</button></div>
    <section class="stat-grid">
        <article><span>Đầu sách</span><strong th:text="${summary.bookTitles()}"></strong></article>
        <article><span>Độc giả</span><strong th:text="${summary.readers()}"></strong></article>
        <article><span>Đang mượn</span><strong th:text="${summary.currentlyBorrowed()}"></strong></article>
        <article><span>Tổng tiền phạt</span><strong th:text="|${#numbers.formatDecimal(summary.fines(), 1, 'COMMA', 0, 'POINT')} đ|"></strong></article>
        <article><span>Bản đã thanh lý</span><strong th:text="${summary.liquidatedCopies()}"></strong></article>
    </section>
    <section class="admin-section"><h2>Sách quá hạn chưa trả</h2><div class="table-wrap"><table><thead><tr><th>Độc giả</th><th>Thẻ</th><th>Sách / mã bản</th><th>Hạn trả</th><th>Trễ</th></tr></thead><tbody>
        <tr th:each="row : ${overdue}"><td th:text="${row.reader()}"></td><td th:text="${row.cardNumber()}"></td><td><span th:text="${row.title()}"></span><br><small th:text="${row.barcode()}"></small></td><td th:text="${row.dueDate()}"></td><td th:text="|${row.daysLate()} ngày|"></td></tr>
        <tr th:if="${#lists.isEmpty(overdue)}"><td colspan="5">Hiện không có sách quá hạn.</td></tr>
    </tbody></table></div></section>
</main></body></html>
