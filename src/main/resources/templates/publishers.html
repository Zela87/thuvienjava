<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhà xuất bản | Quản lý thư viện</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body>
<header th:replace="~{fragments/navigation :: topbar}"></header>
<main class="admin-page"><h1>Quản lý nhà xuất bản</h1>
    <div class="notice" th:if="${message}" th:text="${message == 'linked' ? 'Không thể xóa nhà xuất bản đang có sách sử dụng.' : (message == 'error' ? 'Không thể lưu dữ liệu.' : 'Thao tác hoàn tất.')}"></div>
    <form class="inline-form" method="post" th:action="@{/nxb/luu}"><label>Tên nhà xuất bản<input name="ten" required maxlength="200"></label><label>Địa chỉ<input name="diachi" maxlength="255"></label><button type="submit">Thêm nhà xuất bản</button></form>
    <div class="table-wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Địa chỉ</th><th>Thao tác</th></tr></thead><tbody>
    <tr th:each="row : ${rows}"><td th:text="${row.id()}"></td><td><form class="row-edit" method="post" th:action="@{/nxb/luu}"><input type="hidden" name="id" th:value="${row.id()}"><input name="ten" required th:value="${row.name()}"><input name="diachi" th:value="${row.address()}"><button type="submit">Lưu sửa</button></form></td><td th:text="${row.address()}"></td><td><form method="post" th:action="@{/nxb/xoa}"><input type="hidden" name="id" th:value="${row.id()}"><button class="danger" type="submit">Xóa</button></form></td></tr>
    <tr th:if="${#lists.isEmpty(rows)}"><td colspan="4">Chưa có nhà xuất bản.</td></tr>
    </tbody></table></div>
</main></body></html>
