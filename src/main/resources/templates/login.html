<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Quản lý thư viện</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Quản lý thư viện</h1>
    <p>Đăng nhập vào hệ thống</p>
    <div class="success" th:if="${param.registered}">Đăng ký thành công. Bạn có thể đăng nhập.</div>
    <div class="alert" role="alert" th:if="${error}" th:text="${error}"></div>
    <form method="post" th:action="@{/login}">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               th:value="${username}">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Đăng nhập</button>
    </form>
    <p class="auth-footer">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký độc giả</a></p>
</main>
</body>
</html>
